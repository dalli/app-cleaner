name: Release

# v* 태그를 푸시하면 Apple Silicon(arm64) 바이너리를 빌드해 GitHub 릴리즈에 올린다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈 태그 (예: v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Package
        run: VERSION="${TAG#v}" ./scripts/package-release.sh
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" \
              --notes "Apple Silicon(arm64) 빌드. ad-hoc 서명이며 공증되지 않았습니다."
          fi
          gh release upload "$TAG" --clobber \
            "dist/AppCleaner-${TAG#v}-macos-arm64.zip" \
            "dist/appcleaner-${TAG#v}-macos-arm64.tar.gz" \
            dist/SHA256SUMS.txt
