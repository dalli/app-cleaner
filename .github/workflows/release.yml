name: Release

# v* 태그를 푸시하면 Apple Silicon(arm64) 바이너리를 빌드해 GitHub 릴리즈에 올리고,
# Homebrew tap의 formula를 그 태그로 갱신한다. 테스트는 여기서 돌리지 않는다 — PR 전에 로컬에서 ./scripts/test.sh.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈 태그 (예: v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Package
        run: VERSION="${TAG#v}" ./scripts/package-release.sh
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" \
              --notes "Apple Silicon(arm64) 빌드. ad-hoc 서명이며 공증되지 않았습니다."
          fi
          gh release upload "$TAG" --clobber \
            "dist/AppCleaner-${TAG#v}-macos-arm64.zip" \
            "dist/appcleaner-${TAG#v}-macos-arm64.tar.gz" \
            dist/SHA256SUMS.txt

  # 릴리즈가 올라간 뒤 Homebrew tap(dallisoft/homebrew-tap)의 formula를 이 태그로 갱신한다.
  # packaging/homebrew/appcleaner.rb를 복사하고 url·sha256을 태그의 소스 tarball로 고쳐 푸시한다.
  # tap 쓰기 토큰(시크릿 HOMEBREW_TAP_TOKEN)이 없으면 알림만 남기고 건너뛴다.
  homebrew-tap:
    name: Homebrew tap formula
    needs: macos-arm64
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice title=Homebrew tap::HOMEBREW_TAP_TOKEN 시크릿이 없어 tap formula 갱신을 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.enabled == 'true'
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: app-cleaner
      - uses: actions/checkout@v4
        if: steps.token.outputs.enabled == 'true'
        with:
          repository: dallisoft/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        if: steps.token.outputs.enabled == 'true'
        run: |
          mkdir -p homebrew-tap/Formula
          cp app-cleaner/packaging/homebrew/appcleaner.rb homebrew-tap/Formula/appcleaner.rb
          app-cleaner/scripts/update-homebrew-formula.sh "$TAG" homebrew-tap/Formula/appcleaner.rb
      - name: Commit and push
        if: steps.token.outputs.enabled == 'true'
        working-directory: homebrew-tap
        run: |
          git add Formula/appcleaner.rb
          if git diff --cached --quiet; then
            echo "formula 변경 없음 — 푸시하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "appcleaner ${TAG#v}"
          git push
