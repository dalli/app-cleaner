name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  build-test:
    name: Build & test (macOS arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          uname -m
          swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Build app (arm64)
        run: ARCH=arm64 ./scripts/build-app.sh
